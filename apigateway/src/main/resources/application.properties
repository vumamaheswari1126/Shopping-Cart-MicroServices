spring.application.name=apigateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=product
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webflux.routes[1].id=cart
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/cart/**

spring.cloud.gateway.server.webflux.routes[2].id=order
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/order/**

spring.cloud.gateway.server.webflux.routes[3].id=payment
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payment/**

spring.cloud.gateway.server.webflux.routes[4].id=authservice
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/auth/**

springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/swagger-docs/product

springdoc.swagger-ui.urls[1].name=Cart Service
springdoc.swagger-ui.urls[1].url=/swagger-docs/cart

springdoc.swagger-ui.urls[2].name=Order Service
springdoc.swagger-ui.urls[2].url=/swagger-docs/order

springdoc.swagger-ui.urls[3].name=Payment Service
springdoc.swagger-ui.urls[3].url=/swagger-docs/payment


springdoc.swagger-ui.urls[4].name=Auth Service
springdoc.swagger-ui.urls[4].url=/swagger-docs/auth
